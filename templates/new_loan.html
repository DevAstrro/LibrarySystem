{% extends 'base.html' %}{% block title %}Record a borrowed book{% endblock %}{% block content %}<div class="page-heading"><a class="back-link" href="{{ url_for('dashboard') }}">← Overview</a><p class="eyebrow">NEW TRANSACTION</p><h1>Record a borrowed book</h1><p class="muted">Borrowing date is recorded automatically.</p></div><div class="form-layout"><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Book name <span class="required">*</span><input name="book_title" value="{{ values.get('book_title','') }}" required maxlength="200" autofocus></label><div class="form-grid"><label>Student name<input name="student_name" value="{{ values.get('student_name','') }}" maxlength="100"></label><label>Class / section <span class="required">*</span><input name="class_name" value="{{ values.get('class_name','') }}" required maxlength="40" placeholder="10-A"></label><label>Roll number<input name="roll_number" value="{{ values.get('roll_number','') }}" maxlength="30"></label><label>Expected return date<input type="date" name="due_date" value="{{ values.get('due_date','') }}"></label></div><label>Notes<textarea name="notes" rows="3" maxlength="300">{{ values.get('notes','') }}</textarea></label><div class="form-actions"><a class="button button-secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="button button-primary" type="submit">Save borrowing record</button></div></form></div>{% endblock %}
