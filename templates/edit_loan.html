{% extends 'base.html' %}{% block title %}Edit record #{{ loan.id }}{% endblock %}{% block content %}<div class="page-heading"><a href="{{ url_for('loan_detail',loan_id=loan.id) }}">← Record details</a><h1>Edit borrowing details</h1><p class="muted">Correct the entry without deleting its history.</p></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Book name<input name="book_title" value="{{ loan.book_title }}" required maxlength="180"></label><div class="form-grid"><label>Student name<input name="student_name" value="{{ loan.student_name }}" maxlength="100"></label><label>Class / section<input name="class_name" value="{{ loan.class_name }}" required maxlength="40"></label><label>Roll number<input name="roll_number" value="{{ loan.roll_number }}" maxlength="30"></label><label>Due date<input type="date" name="due_date" value="{{ loan.due_date }}"></label></div><label>Notes<textarea name="notes" rows="3" maxlength="300">{{ loan.notes }}</textarea></label><div class="form-actions"><a class="button button-secondary" href="{{ url_for('loan_detail',loan_id=loan.id) }}">Cancel</a><button class="button button-primary" type="submit">Save changes</button></div></form>{% endblock %}
